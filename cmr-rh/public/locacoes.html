<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Locações CMR</title>
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locações CMR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/locacoes.webmanifest">
<link rel="icon" href="/cmr-logo.png">
<link rel="apple-touch-icon" href="/locacoes-icon-180.png">
<style>
/* Mesmo tema do Efetivo CMR */
:root{
  --red:#C8102E;--red-dark:#9e0c24;--red-soft:#fbe7ea;
  --bg:#f2f2f4;--card:#ffffff;--text:#151515;--muted:#6b6b72;--line:#e3e3e8;
  --ok:#0f8a55;--ok-soft:#e3f5ec;--off:#b0452f;--off-soft:#fbeae5;--chip:#f0f0f3;
  --warn:#a86200;--warn-soft:#fff1d6;--money:#5b3cc4;--money-soft:#efeafd;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f0f10;--card:#1a1a1c;--text:#ececef;--muted:#9a9aa3;--line:#2c2c30;
    --red-soft:#3a1219;--ok:#35c486;--ok-soft:#10301f;--off:#ff8a70;--off-soft:#3a1d15;--chip:#26262a;
    --warn:#f2b53c;--warn-soft:#3a2c0f;--money:#b9a6ff;--money-soft:#241d3d;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;letter-spacing:.3px;flex:1;min-width:0}
.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.85;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-size:13px}
.tabs{display:flex;background:var(--red-dark)}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.7);padding:10px 0;font-weight:600;font-size:14px;border-bottom:3px solid transparent;position:relative}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.tabs .bolha{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--red);font-size:11px;font-weight:800;line-height:18px;padding:0 5px;margin-left:5px;vertical-align:1px}

main{max-width:560px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-height:44px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.dia{font-size:13px;color:var(--muted);margin-top:6px}
.link{background:none;border:0;color:var(--red);font-weight:600;padding:6px 0}
.mt{margin-top:10px}

.contagem{display:flex;gap:8px;margin-bottom:10px}
.contagem button{flex:1;border-radius:12px;padding:10px 4px;text-align:center;background:var(--card);border:1px solid var(--line)}
.contagem button.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.contagem b{display:block;font-size:22px;line-height:1.1}
.contagem span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.contagem .p b{color:var(--ok)} .contagem .w b{color:var(--warn)} .contagem .a b{color:var(--off)}

/* card de equipamento (mesmo desenho do card de pessoa) */
.eq{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:8px}
.eq.alerta{border-left-color:var(--warn)} .eq.vencido{border-left-color:var(--off)} .eq.devolvido{border-left-color:var(--muted);opacity:.9}
.eq-top{display:flex;gap:10px;align-items:flex-start}
.eq-info{flex:1;min-width:0}
.eq-nome{font-weight:700;font-size:16px}
.eq-nome small{font-weight:600;color:var(--muted);font-size:13px}
.eq-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;background:var(--chip);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.a{background:var(--off-soft);color:var(--off)} .tag.m{background:var(--money-soft);color:var(--money)}
.eq-obs{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:8px}
.mini{display:flex;gap:5px;margin-top:8px}
.mini img{width:42px;height:42px;border-radius:7px;object-fit:cover;background:var(--chip)}
.eq-acoes{display:flex;gap:8px;margin-top:10px}
.eq-acoes button{flex:1;border:0;border-radius:10px;height:42px;font-weight:700;font-size:14px}
.b-ren{background:var(--red);color:#fff}
.b-dev{background:var(--chip);color:var(--text)}
.pend{font-size:11px;font-weight:700;color:var(--warn)}

textarea.field{min-height:72px;resize:vertical}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.barra .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.btn{border:0;border-radius:12px;min-height:50px;padding:0 16px;font-weight:700;font-size:15px}
.btn.pri{background:var(--red);color:#fff;flex:1}
.btn.zap{background:#1faa53;color:#fff;flex:1}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.warn{background:var(--warn);color:#fff;flex:1}
.btn.full{width:100%}
.btn[disabled]{opacity:.45}
.status{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 10px}
.status.err{color:var(--off);font-weight:600}
.status.ok{color:var(--ok)}

/* folhas (bottom sheets) */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:90vh;display:flex;flex-direction:column;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.folha .puxador{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.folha h2{font-size:17px;margin:0 0 10px}
.folha .corpo{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.folha .pe{display:flex;gap:8px;margin-top:12px}
.previa{white-space:pre-wrap;background:#e7ffdb;color:#111;border-radius:10px;padding:12px;font-size:14px;line-height:1.45}
@media (prefers-color-scheme:dark){.previa{background:#025c4c;color:#e9edef}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 12px;font-size:13px;font-weight:600}
.chips button.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.sep{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 4px}
.inst{display:flex;align-items:center;gap:10px;background:var(--red-soft);border:1px solid var(--red);border-radius:12px;
  padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.inst span{flex:1}
.inst button{border:0;background:var(--red);color:#fff;border-radius:9px;height:38px;padding:0 14px;font-weight:700;flex:none}
.aviso{background:#fff4d6;color:#6b4a00;border:1px solid #f0dca6;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px;text-align:center}
@media (prefers-color-scheme:dark){.aviso{background:#3a2f0f;color:#f4dfa0;border-color:#5a4a1c}}
.passos{counter-reset:p;padding:0;margin:6px 0 0;list-style:none}
.passos li{counter-increment:p;position:relative;padding:8px 0 8px 34px;border-bottom:1px solid var(--line);font-size:14px}
.passos li:before{content:counter(p);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700}
.vazio{text-align:center;color:var(--muted);padding:30px 10px}

/* formulário */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2>div{min-width:0}
.f{margin-bottom:10px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--money-soft);color:var(--money);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.total b{font-size:18px}
.total small{display:block;font-size:12px;opacity:.85}

/* fotos */
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.fotos .ft{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
.fotos .ft img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .ft .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
.fotos .ft .pf{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center;padding:2px}
.add-foto{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;text-align:center;position:relative;overflow:hidden}
.add-foto input{position:absolute;inset:0;opacity:0}
.add-foto b{display:block;font-size:22px}
.visor{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center}
.visor img{max-width:100%;max-height:100%}
.visor .cap{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));color:#fff;font-size:13px;text-align:center;opacity:.85}

/* detalhe / valores */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:4px 0 10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:16px}
.hist li{margin:3px 0}
.tot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tot-grid div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tot-grid div.l{grid-column:1/-1}
.tot-grid span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.tot-grid b{display:block;font-size:20px;margin-top:2px}
.lin{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.lin .grow{flex:1;min-width:0}
.lin .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .s{font-size:12px;color:var(--muted)}
.lin .v{font-weight:700;text-align:right;white-space:nowrap}
.lin .v small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.barrinha{height:5px;border-radius:3px;background:var(--chip);margin-top:5px;overflow:hidden}
.barrinha i{display:block;height:100%;background:var(--red)}
.data-cx{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--chip);padding:5px 0}
.data-cx b{display:block;font-size:17px;line-height:1}
.data-cx span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.data-cx.w{background:var(--warn-soft);color:var(--warn)} .data-cx.a{background:var(--off-soft);color:var(--off)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:22px}
.login img{width:110px;display:block;margin:0 auto 10px;background:#fff;border-radius:12px;padding:8px 10px}
.login h2{text-align:center;margin:0 0 4px}
.login p{text-align:center;color:var(--muted);margin:0 0 16px;font-size:13px}
.login .field{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="tela-login" class="login hidden">
  <form class="card" id="form-login">
    <img src="/cmr-logo.png" alt="">
    <h2>Locações CMR</h2>
    <p>Entre com o mesmo login do Sistema RH</p>
    <input id="lg-email" class="field" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="lg-senha" class="field" type="password" placeholder="Senha" autocomplete="current-password" required>
    <div id="lg-erro" class="status err hidden"></div>
    <button class="btn pri" style="width:100%" id="lg-btn">Entrar</button>
  </form>
</section>

<!-- APP -->
<section id="tela-app" class="hidden">
  <header>
    <div class="top">
      <h1>Locações CMR<small id="top-user"></small></h1>
      <button class="ic" data-a="recarregar" title="Atualizar">↻</button>
      <button class="ic" data-a="ajustes" title="Ajustes">⚙</button>
      <button class="ic" data-a="sair">Sair</button>
    </div>
    <nav class="tabs">
      <button id="tab-eq" class="on" data-aba="eq">Equipamentos</button>
      <button id="tab-ag" data-aba="ag">Agenda</button>
      <button id="tab-val" data-aba="val">Valores</button>
    </nav>
  </header>

  <!-- EQUIPAMENTOS -->
  <main id="pg-eq">
    <div id="aviso-off" class="aviso hidden"></div>
    <div id="banner-inst" class="inst hidden">
      <span>📲 Instale na tela inicial para abrir como aplicativo</span>
      <button data-a="instalar">Instalar</button>
    </div>
    <div class="card">
      <div class="lbl">Obra</div>
      <select id="f-obra" class="field"></select>
      <input id="f-busca" class="field mt" type="search" placeholder="Buscar equipamento, fornecedor, código…">
    </div>
    <div id="status" class="status"></div>
    <div class="contagem" id="contagem"></div>
    <div id="lista"></div>
  </main>

  <!-- AGENDA -->
  <main id="pg-ag" class="hidden">
    <div class="card">
      <div class="lbl">Obra</div>
      <select id="a-obra" class="field"></select>
    </div>
    <div id="ag-lista"></div>
  </main>

  <!-- VALORES -->
  <main id="pg-val" class="hidden">
    <div class="card">
      <div class="lbl">Obra</div>
      <select id="v-obra" class="field"></select>
    </div>
    <div id="val-corpo"></div>
  </main>

  <div class="barra" id="barra">
    <div class="in" id="barra-in"></div>
  </div>
</section>

<div id="veu" class="veu hidden">
  <div class="folha" id="folha"></div>
</div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
// Locações CMR — controle de equipamentos locados em obra pelo celular.
// Mesmo login e mesmas obras do Sistema RH (como o Efetivo CMR).
// Locações e fotos ficam no servidor (/api/locacoes); sem sinal, o app
// abre com a última cópia e guarda as alterações numa fila.
// ════════════════════════════════════════════════════════════════
const TOKEN_KEY='cmr_locacoes_token', USER_KEY='cmr_locacoes_user', BASE_KEY='cmr_locacoes_base';
const FILA_KEY='cmr_locacoes_fila', CFG_KEY='cmr_locacoes_cfg', OBRA_KEY='cmr_locacoes_obra';
const TODAS='__todas__';
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PER={diaria:{nome:'Diária',dias:1,r:['diária','diárias']},semanal:{nome:'Semanal',dias:7,r:['semana','semanas']},
  quinzenal:{nome:'Quinzenal',dias:15,r:['quinzena','quinzenas']},mensal:{nome:'Mensal',dias:null,r:['mês','meses']}};

let token=null, usuario=null, offline=false, promptInstalar=null;
let OBRAS=[], LOC=[];
let filtro='ativos', aba='eq';
let cfg={alertaDias:7,notificar:false,ultimaNotif:null};
try{ cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(CFG_KEY)||'{}')); }catch(_){}

// ── utilidades ──
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{ const [a,m,d]=s.split('-').map(Number); return new Date(a,m-1,d); };
const hoje=()=>toISO(new Date());
const difDias=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const maxISO=(a,b)=>!a?b:!b?a:(a>b?a:b);
const br=s=>{ if(!s) return '—'; const [a,m,d]=s.split('-'); return d+'/'+m+'/'+a; };
const curta=s=>{ if(!s) return '—'; const d=parseISO(s); return pad(d.getDate())+' '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); };
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const din=v=>BRL.format(Number(v)||0);
const r2=v=>Math.round(v*100)/100;
const plural=(n,[um,v])=>n+' '+(n===1?um:v);
function lerDin(s){ s=String(s||'').replace(/[^\d,.-]/g,''); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return Number.isFinite(v)?r2(v):0; }
const dinCampo=v=>(v===''||v==null||Number(v)===0)?'':Number(v).toFixed(2).replace('.',',');
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function salvarCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); }catch(_){} }

// ── períodos e cobrança ──
// Mensal soma mês civil (31/jan + 1 = 28/fev).
function addPer(iso,p,n){
  n=n==null?1:n; const d=parseISO(iso);
  if(p==='mensal'){ const dia=d.getDate(); const a=new Date(d.getFullYear(),d.getMonth()+n,1);
    a.setDate(Math.min(dia,new Date(a.getFullYear(),a.getMonth()+1,0).getDate())); return toISO(a); }
  d.setDate(d.getDate()+PER[p].dias*n); return toISO(d);
}
function contarCheios(ent,ref,p){
  if(!ent||!ref||ref<=ent) return 1;
  if(p!=='mensal') return Math.max(1,Math.ceil(difDias(ent,ref)/PER[p].dias));
  let n=0; while(addPer(ent,p,n)<ref) n++; return Math.max(1,n);
}
// Proporcional (padrão): períodos cheios + dias avulsos × (valor ÷ dias do período; mensal ÷ 30).
//   Devolvido: até a data real da devolução. Ativo: até max(hoje, fim). Mínimo 1 dia.
// Cheio: período iniciado = inteiro; devolução antecipada paga até o fim do contrato.
function periodos(l){
  if(l.cobranca==='cheio'){
    const ref=l.status==='devolvido'?maxISO(l.devolucao,l.fim):maxISO(hoje(),l.fim);
    const n=contarCheios(l.entrada,ref,l.periodo); return {fator:n,texto:plural(n,PER[l.periodo].r)};
  }
  const ref=l.status==='devolvido'?l.devolucao:maxISO(hoje(),l.fim);
  let n=0; while(addPer(l.entrada,l.periodo,n+1)<=ref) n++;
  let dias=difDias(addPer(l.entrada,l.periodo,n),ref); if(n===0&&dias<=0) dias=1;
  const base=PER[l.periodo].dias||30;
  return {fator:n+dias/base,texto:[n&&plural(n,PER[l.periodo].r),dias&&plural(dias,['dia','dias'])].filter(Boolean).join(' + ')};
}
function custo(l){
  const p=periodos(l), manual=l.valorManual!==''&&l.valorManual!=null;
  const aluguel=manual?Number(l.valorManual):r2(p.fator*(Number(l.valor)||0)*(Number(l.qtd)||1));
  const extras=Number(l.extras)||0;
  return {periodos:p.texto,aluguel,extras,total:r2(aluguel+extras),manual};
}
function situacao(l){
  if(l.status==='devolvido') return {k:'devolvido',dias:null};
  const d=difDias(hoje(),l.fim);
  if(d<0) return {k:'vencido',dias:d};
  if(d<=cfg.alertaDias) return {k:'alerta',dias:d};
  return {k:'ok',dias:d};
}
const emAlerta=l=>{ const k=situacao(l).k; return k==='alerta'||k==='vencido'; };
const ativos=()=>LOC.filter(l=>l.status!=='devolvido');
const porFim=(a,b)=>a.fim<b.fim?-1:a.fim>b.fim?1:a.nome.localeCompare(b.nome,'pt');

// ── API ──
class ErroRede extends Error{}
async function api(url,payload){
  let r;
  try{ r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
  catch(e){ throw new ErroRede('Sem conexão'); }
  let d={}; try{ d=await r.json(); }catch(e){}
  if(r.status===401&&url!=='/api/auth'){ sair(true); throw new Error('Sessão expirada — entre de novo'); }
  if(!r.ok) throw new Error(d.error||('Erro '+r.status));
  return d;
}
const loc=p=>api('/api/locacoes',Object.assign({token},p));
const fotoURL=path=>'/api/locacoes?foto='+encodeURIComponent(path)+'&t='+encodeURIComponent(token);

    await iniciar();
  }catch(err){ e.textContent=err instanceof ErroRede?'Sem conexão — precisa de internet para entrar.':err.message; e.classList.remove('hidden'); }
  finally{ b.disabled=false; b.textContent='Entrar'; }
});
function sair(expirou){

  token=null; usuario=null; fecharFolha();
  $('tela-app').classList.add('hidden'); $('tela-login').classList.remove('hidden');

}

// ── carga / offline ──
function guardarBase(){ try{ localStorage.setItem(BASE_KEY,JSON.stringify({OBRAS,LOC,em:new Date().toISOString(),por:usuario&&usuario.email})); }catch(_){} }
function lerBase(){ try{ return JSON.parse(localStorage.getItem(BASE_KEY)||'null'); }catch(_){ return null; } }
async function carregarTudo(){
  try{
    const [o,l]=await Promise.all([ api('/api/dados',{token,action:'carregar-obras'}), loc({action:'carregar'}) ]);
    OBRAS=(o.obras||[]).slice(); LOC=(l.locacoes||[]).slice(); offline=false;
    aplicarFilaLocal(); guardarBase();
  }catch(err){
    if(!(err instanceof ErroRede)) throw err;
    const b=lerBase(); if(!b) throw new Error('Sem conexão — na primeira vez precisa de internet');
    OBRAS=b.OBRAS||[]; LOC=b.LOC||[]; offline=true; aplicarFilaLocal();
  }
  pintarConexao();
}
function pintarConexao(){
  const f=fila(), partes=[];
  if(offline||!navigator.onLine) partes.push('📴 Sem conexão — dá para cadastrar e fotografar normalmente');
  if(f.length) partes.push(f.length+' alteração(ões) esperando para enviar');
  $('aviso-off').textContent=partes.join(' · ');
  $('aviso-off').classList.toggle('hidden',!partes.length);
}
async function iniciar(){
  $('tela-login').classList.add('hidden'); $('tela-app').classList.remove('hidden');
  $('top-user').textContent=usuario?(usuario.name||usuario.email):'';

  $('status').textContent='';
  montarObras(); render(); enviarFila(); notificar();
}
async function recarregar(){
  try{ await enviarFila(); await carregarTudo(); montarObras(); render(); toast(offline?'Sem conexão — mostrando a última cópia':'Atualizado'); }
  catch(err){ toast(err.message); }
}

// ── fila de envio (obra sem sinal) ──
// Alterações: localStorage. Fotos (pesadas): IndexedDB.
function fila(){ try{ return JSON.parse(localStorage.getItem(FILA_KEY)||'[]'); }catch(_){ return []; } }
function gravarFila(f){ try{ localStorage.setItem(FILA_KEY,JSON.stringify(f)); }catch(_){} }
function enfileirar(op){
  // Para a mesma locação vale só a última alteração; exclusão descarta o resto.
  let f=fila().filter(x=>x.id!==op.id||(x.tipo==='foto'));
  if(op.tipo==='excluir') f=f.filter(x=>x.id!==op.id);
  f.push(op); gravarFila(f); pintarConexao();
}
function aplicarFilaLocal(){
  for(const op of fila()){
    if(op.tipo==='salvar'){ const i=LOC.findIndex(x=>x.id===op.id); const v=Object.assign({},i>=0?LOC[i]:{},op.locacao,{pendente:true,fotos:(i>=0?LOC[i].fotos:op.locacao.fotos)||[]}); if(i>=0) LOC[i]=v; else LOC.push(v); }
    if(op.tipo==='excluir') LOC=LOC.filter(x=>x.id!==op.id);
  }
}
let enviando=false;
async function enviarFila(){
  if(enviando) return; enviando=true;
  try{
    const f=fila(); let ok=0; const restam=[];
    for(const op of f){
      try{
        if(op.tipo==='salvar'){ const r=await loc({action:'salvar',locacao:op.locacao}); mesclar(r.locacao); }
        if(op.tipo==='excluir'){ await loc({action:'excluir',id:op.id}); }
        ok++;
      }catch(err){ if(err instanceof ErroRede) restam.push(op); else { ok++; toast('Não enviado ('+(op.locacao?op.locacao.nome:'item')+'): '+err.message); } }
    }
    gravarFila(restam.concat(fila().filter(x=>!f.includes(x)&&!f.some(y=>JSON.stringify(y)===JSON.stringify(x)))));
    const nf=await enviarFotosPendentes();
    if(ok||nf){ offline=false; guardarBase(); render(); if(ok+nf) toast((ok+nf)+' alteração(ões) enviada(s)'); }
  }finally{ enviando=false; pintarConexao(); }
}
window.addEventListener('online',()=>{ pintarConexao(); enviarFila(); });
window.addEventListener('offline',pintarConexao);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&token){ render(); enviarFila(); } });

// IndexedDB mínimo para fotos pendentes
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('cmr_locacoes',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('fotos',{keyPath:'fotoId'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbOp(modo,fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('fotos',modo); const q=fn(t.objectStore('fotos')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }); }
const fotosPendentes=()=>idbOp('readonly',s=>s.getAll()).catch(()=>[]);
async function enviarFotosPendentes(){
  const l=await fotosPendentes(); let n=0;
  for(const p of l){
    if(fila().some(x=>x.tipo==='salvar'&&x.id===p.id)) continue; // a locação ainda não subiu
    try{
      const r=await loc({action:'foto-enviar',id:p.id,tipo:p.tipo,imagem:p.imagem,fotoId:p.fotoId});
      mesclar(r.locacao); await idbOp('readwrite',s=>s.delete(p.fotoId)); n++;
    }catch(err){ if(!(err instanceof ErroRede)){ await idbOp('readwrite',s=>s.delete(p.fotoId)); toast('Foto descartada: '+err.message); } }
  }
  return n;
}
function mesclar(l){ const i=LOC.findIndex(x=>x.id===l.id); if(i>=0) LOC[i]=l; else LOC.push(l); guardarBase(); }

// Grava no servidor; sem sinal, guarda na fila e segue.
async function salvarLoc(l,msgOk){
  const local=Object.assign({},l,{pendente:true});
  const i=LOC.findIndex(x=>x.id===l.id), antes=i>=0?LOC[i]:null;
  if(i>=0) LOC[i]=Object.assign({},LOC[i],local); else LOC.push(local);
  try{
    const r=await loc({action:'salvar',locacao:l}); mesclar(r.locacao); offline=false;
    if(msgOk) toast(msgOk);
  }catch(err){
    if(err instanceof ErroRede){ offline=true; enfileirar({tipo:'salvar',id:l.id,locacao:l}); guardarBase(); toast('📴 Guardado no celular — envia sozinho quando tiver sinal'); }
    else { if(antes) LOC[i]=antes; else LOC=LOC.filter(x=>x.id!==l.id); render(); throw err; }
  }
  render(); pintarConexao();
}

// ── fotos ──
// JPEG até 1280 px, com carimbo (tipo · equipamento · data/hora) gravado na imagem.
function carregarImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=rej; i.src=u; }); }
async function processarFoto(file,legenda){
  const img=await carregarImg(file), MAX=1280, k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(img,0,0,w,h);
  const a=new Date(), txt=legenda+' · '+pad(a.getDate())+'/'+pad(a.getMonth()+1)+'/'+a.getFullYear()+' '+pad(a.getHours())+':'+pad(a.getMinutes());
  const fs=Math.max(14,Math.round(w/42)); g.font='600 '+fs+'px sans-serif';
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,h-fs*2,Math.min(w,g.measureText(txt).width+fs*1.5),fs*2);
  g.fillStyle='#fff'; g.fillText(txt,fs*.75,h-fs*.65);
  return c.toDataURL('image/jpeg',.72);
}
async function enviarFoto(id,tipo,imagem,fotoId){
  fotoId=fotoId||uid();
  try{
    if(fila().some(x=>x.tipo==='salvar'&&x.id===id)) throw new ErroRede('locação ainda na fila');
    const r=await loc({action:'foto-enviar',id,tipo,imagem,fotoId}); mesclar(r.locacao); return true;
  }catch(err){
    if(!(err instanceof ErroRede)) throw err;
    await idbOp('readwrite',s=>s.put({fotoId,id,tipo,imagem,em:new Date().toISOString()})); pintarConexao(); return false;
  }
}
async function gradeFotos(el,o){
  const desenhar=async()=>{
    let itens;
    if(o.pend) itens=o.pend.map(p=>({k:p.fotoId,src:p.imagem,pf:'nova'}));
    else{
      const l=LOC.find(x=>x.id===o.id)||{fotos:[]};
      const pend=(await fotosPendentes()).filter(p=>p.id===o.id&&p.tipo===o.tipo);
      itens=(l.fotos||[]).filter(f=>f.tipo===o.tipo).map(f=>({k:f.path,src:fotoURL(f.path),cap:new Date(f.em).toLocaleString('pt-BR')+(f.por?' · '+f.por:'')}))
        .concat(pend.map(p=>({k:'p:'+p.fotoId,src:p.imagem,pf:'📴 a enviar'})));
    }
    el.innerHTML=itens.map(it=>'<div class="ft"><img src="'+esc(it.src)+'" data-zoom="'+esc(it.k)+'" alt="">'+(it.pf?'<div class="pf">'+it.pf+'</div>':'')+'<button type="button" class="x" data-rm="'+esc(it.k)+'">×</button></div>').join('')
      +'<label class="add-foto"><div><b>📷</b>Foto</div><input type="file" accept="image/*" multiple></label>';
    el.querySelectorAll('[data-zoom]').forEach(i=>i.addEventListener('click',()=>{ const it=itens.find(x=>x.k===i.dataset.zoom); visor(it.src,(o.tipo==='recebimento'?'Recebimento':'Entrega')+(it.cap?' · '+it.cap:'')); }));
    el.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',async()=>{
      if(!b.dataset.armado){ b.dataset.armado='1'; b.textContent='🗑'; b.style.background='var(--off)'; toast('Toque de novo para apagar'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armado; b.textContent='×'; b.style.background=''; } },3000); return; }
      const k=b.dataset.rm;
      if(o.pend){ o.pend.splice(o.pend.findIndex(p=>p.fotoId===k),1); }
      else if(k.startsWith('p:')){ await idbOp('readwrite',s=>s.delete(k.slice(2))); }
      else{ try{ const r=await loc({action:'foto-remover',id:o.id,path:k}); mesclar(r.locacao); }catch(err){ return toast(err instanceof ErroRede?'Sem conexão — tente com sinal':err.message); } }
      desenhar(); render();
    }));
    const inp=el.querySelector('input[type=file]');
    inp.addEventListener('change',async()=>{
      const files=[...inp.files]; if(!files.length) return;
      toast('Processando '+files.length+' foto(s)…');
      const legenda=(o.tipo==='recebimento'?'RECEBIMENTO':'ENTREGA')+' · '+o.nome();
      let n=0, fora=0;
      for(const fl of files){
        try{
          const imagem=await processarFoto(fl,legenda);
          if(o.pend){ o.pend.push({fotoId:uid(),imagem}); n++; }
          else{ (await enviarFoto(o.id,o.tipo,imagem))?n++:fora++; }
        }catch(err){ toast('Foto não enviada: '+err.message); }
      }
      if(!o.pend) toast(fora?fora+' foto(s) guardada(s) no celular — envia com sinal':n+' foto(s) enviada(s)');
      desenhar(); render();
    });
  };
  await desenhar();
}

  const d=document.createElement('div'); d.className='visor';
  d.innerHTML='<img src="'+esc(src)+'" alt=""><div class="cap">'+esc(cap)+' · toque para fechar</div>';
  d.addEventListener('click',()=>d.remove()); document.body.appendChild(d);
}

function icsEsc(s){ return String(s||'').replace(/[\\;,]/g,c=>'\\'+c).replace(/\n/g,'\\n'); }
function gerarICS(lista){
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CMR Empreendimentos//Locacoes//PT','CALSCALE:GREGORIAN']
    .concat(lista.map(l=>['BEGIN:VEVENT','UID:'+l.id+'-'+l.fim.replace(/-/g,'')+'@cmr-locacoes','DTSTAMP:'+st,
      'DTSTART;VALUE=DATE:'+l.fim.replace(/-/g,''),'DTEND;VALUE=DATE:'+addPer(l.fim,'diaria').replace(/-/g,''),
      'SUMMARY:'+icsEsc('Vence locação: '+l.nome+(l.fornecedor?' ('+l.fornecedor+')':'')),
      'DESCRIPTION:'+icsEsc('Obra: '+nomeObra(l)+'\nEntrada: '+br(l.entrada)+'\nCódigo: '+(l.codigo||'—')+'\nRenovar ou devolver.'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Locação vence em '+cfg.alertaDias+' dias: '+l.nome),'TRIGGER:-P'+cfg.alertaDias+'D','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Locação vence hoje: '+l.nome),'TRIGGER:PT8H','END:VALARM','END:VEVENT'].join('\r\n')))
    .concat(['END:VCALENDAR']).join('\r\n');
}
async function entregarArquivo(nome,conteudo,mime){
  const blob=new Blob([conteudo],{type:mime}), file=new File([blob],nome,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:nome}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function exportarCSV(){
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"', n=v=>(Number(v)||0).toFixed(2).replace('.',',');
  const cab=['Equipamento','Qtd','Fornecedor','Obra','Período','Cobrança','Entrada','Fim','Devolução','Situação','Renovações','Valor/período','Cobrado','Aluguel','Outros custos','Total','Código','Observações','Cadastrado por'];
  const lin=listaValores().slice().sort((a,b)=>a.entrada.localeCompare(b.entrada)).map(l=>{ const c=custo(l);
    return [l.nome,l.qtd,l.fornecedor,nomeObra(l),PER[l.periodo].nome,l.cobranca==='cheio'?'período cheio':'proporcional',br(l.entrada),br(l.fim),l.devolucao?br(l.devolucao):'',
      situacao(l).k,(l.renovacoes||[]).length,n(l.valor),c.manual?'manual':c.periodos,n(c.aluguel),n(c.extras),n(c.total),l.codigo,l.obs,l.criadoPor].map(cel).join(';'); });
  entregarArquivo('locacoes-'+hoje()+'.csv','﻿'+[cab.map(cel).join(';')].concat(lin).join('\r\n'),'text/csv');
}

// ── ajustes e notificação ──
function abrirAjustes(){
  abrirFolha('<h2>Ajustes</h2><div class="corpo">'
    +'<div class="lbl">Alertar com quantos dias de antecedência</div><input id="aj-d" class="field" type="number" inputmode="numeric" min="0" max="60" value="'+cfg.alertaDias+'">'
    +'<div class="dia">Vale para este celular.</div>'
    +'<div class="lbl mt">Avisos</div>'
    +'<button class="btn sec full" data-a="notif">'+(cfg.notificar&&'Notification' in window&&Notification.permission==='granted'?'🔔 Notificações ativadas':'🔔 Ativar notificação diária')+'</button>'
    +'<button class="btn sec full mt" data-a="ics">📅 Enviar vencimentos ao Calendário</button>'
    +'<div class="dia">O Calendário avisa mesmo com o app fechado ('+cfg.alertaDias+' dias antes e no dia). A notificação do app aparece ao abri-lo.</div>'
    +'</div><div class="pe"><button class="btn pri" data-a="fechar">Fechar</button></div>');
  $('aj-d').addEventListener('change',e=>{ cfg.alertaDias=Math.min(60,Math.max(0,parseInt(e.target.value,10)||0)); salvarCfg(); render(); });
}
async function ativarNotif(){
  if(!('Notification' in window)) return toast('No iPhone, instale o app na tela inicial (iOS 16.4+) para receber notificações.');
  const p=await Notification.requestPermission(); cfg.notificar=p==='granted'; cfg.ultimaNotif=null; salvarCfg();
  toast(cfg.notificar?'Notificações ativadas':'Permissão negada nos ajustes do celular'); if(cfg.notificar) notificar(); abrirAjustes();
}
async function notificar(){
  if(!cfg.notificar||!('Notification' in window)||Notification.permission!=='granted'||cfg.ultimaNotif===hoje()) return;
  const l=ativos().filter(emAlerta).sort(porFim); if(!l.length) return;
  const venc=l.filter(x=>situacao(x).k==='vencido').length;
  const corpo=l.slice(0,4).map(x=>{ const d=situacao(x).dias; return x.nome+': '+(d<0?Math.abs(d)+'d vencido':d===0?'vence hoje':'vence em '+d+'d'); }).join('\n');
  try{ const reg=await navigator.serviceWorker.ready;
    await reg.showNotification(venc?venc+' locação(ões) vencida(s)':l.length+' locação(ões) vencendo',{body:corpo,icon:'/locacoes-icon-192.png',tag:'locacoes'});
    cfg.ultimaNotif=hoje(); salvarCfg(); }catch(_){}
}

// ── abas e ações ──
function trocarAba(q){
  aba=q; ['eq','ag','val'].forEach(x=>{ $('tab-'+x).classList.toggle('on',x===q); $('pg-'+x).classList.toggle('hidden',x!==q); });
  render(); window.scrollTo(0,0);
}
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-a],[data-aba],[data-f],[data-ren],[data-dev],[data-ver]'); if(!t) return;
  const d=t.dataset;
  if(d.aba) return trocarAba(d.aba);
  if(d.f){ filtro=d.f; return renderLista(); }
  if(d.ren){ ev.stopPropagation(); return abrirRenovar(d.ren); }
  if(d.dev){ ev.stopPropagation(); return abrirDevolver(d.dev); }
  if(d.ver&&!d.a) return abrirDetalhe(d.ver);
  switch(d.a){
    case 'recarregar': return recarregar();
    case 'sair': return sair();
    case 'ajustes': return abrirAjustes();
    case 'fechar': return fecharFolha();
    case 'novo': return abrirForm();
    case 'editar': return abrirForm(d.id);
    case 'instalar': return instalar();
    case 'notif': return ativarNotif();
    case 'csv': return exportarCSV();
    case 'ics': { const l=ativos().filter(daObra); if(!l.length) return toast('Nenhuma locação ativa'); return entregarArquivo('vencimentos-'+hoje()+'.ics',gerarICS(l),'text/calendar'); }
    case 'ics-um': { const l=LOC.find(x=>x.id===d.id); return entregarArquivo(l.nome.replace(/\W+/g,'-')+'.ics',gerarICS([l]),'text/calendar'); }
    case 'msg-alertas': return abrirMensagem(textoAlertas());
    case 'msg-valores': return abrirMensagem(textoValores());
    case 'copiar': return copiar(window._msg);
    case 'whats': location.href='https://wa.me/?text='+encodeURIComponent(window._msg); return;
    case 'excluir': {
      const l=LOC.find(x=>x.id===d.id);
      if(!confirm('Excluir "'+l.nome+'" e todas as fotos? Isso vale para todos os usuários.')) return;
      LOC=LOC.filter(x=>x.id!==l.id);
      try{ await loc({action:'excluir',id:l.id}); toast('Locação excluída'); }
      catch(err){ if(err instanceof ErroRede){ enfileirar({tipo:'excluir',id:l.id}); toast('📴 Exclusão guardada — envia com sinal'); } else { toast(err.message); await recarregar(); } }
      guardarBase(); fecharFolha(); return render();
    }
    case 'desfazer-ren': {
      const l=LOC.find(x=>x.id===d.id), r=l.renovacoes[l.renovacoes.length-1];
      if(!confirm('Desfazer renovação? O fim volta de '+br(r.para)+' para '+br(r.de)+'.')) return;
      try{ await salvarLoc(Object.assign({},l,{fim:r.de,renovacoes:l.renovacoes.slice(0,-1)}),'Renovação desfeita'); fecharFolha(); }catch(err){ toast(err.message); } return;
    }
    case 'reabrir': {
      const l=LOC.find(x=>x.id===d.id);
      if(!confirm('Reabrir esta locação? Ela volta para os ativos.')) return;
      try{ await salvarLoc(Object.assign({},l,{status:'ativo',devolucao:null}),'Locação reaberta'); fecharFolha(); }catch(err){ toast(err.message); } return;
    }
  }
});

// ── instalação na tela inicial ──
// Escopo '/locacoes' de propósito, como o Efetivo: não toca no Sistema RH.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/locacoes-sw.js',{scope:'/locacoes'}).catch(()=>{}));
}
const instalado=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt',ev=>{ ev.preventDefault(); promptInstalar=ev; if(!instalado()) $('banner-inst').classList.remove('hidden'); });
window.addEventListener('appinstalled',()=>{ $('banner-inst').classList.add('hidden'); promptInstalar=null; toast('App instalado'); });
async function instalar(){
  if(promptInstalar){ promptInstalar.prompt(); const r=await promptInstalar.userChoice.catch(()=>null); if(r&&r.outcome==='accepted') $('banner-inst').classList.add('hidden'); promptInstalar=null; return; }
  abrirFolha('<h2>Instalar na tela inicial</h2><div class="corpo">'
    +(ehIOS()?'<ol class="passos"><li>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima), na barra de baixo do Safari.</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>'
      :'<ol class="passos"><li>Toque no menu <b>⋮</b> do Chrome.</li><li>Toque em <b>Instalar app</b> (ou "Adicionar à tela inicial").</li><li>Confirme.</li></ol>')
    +'<p class="dia">Instalado, abre em tela cheia e funciona mesmo sem sinal na obra.</p></div><div class="pe"><button class="btn pri" data-a="fechar">Entendi</button></div>');
}

// ── partida ──
(function(){
  try{
    token=localStorage.getItem(TOKEN_KEY); usuario=JSON.parse(localStorage.getItem(USER_KEY)||'null');
    // Quem já entrou no Efetivo neste celular não precisa digitar a senha de novo.
    if(!token&&localStorage.getItem('cmr_efetivo_token')){ token=localStorage.getItem('cmr_efetivo_token'); usuario=JSON.parse(localStorage.getItem('cmr_efetivo_user')||'null'); }
  }catch(_){}
  if(token) iniciar(); else $('tela-login').classList.remove('hidden');
  if(ehIOS()&&!instalado()) $('banner-inst').classList.remove('hidden');
})();
</script>
